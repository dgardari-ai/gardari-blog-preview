<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обновлённая форма · шесть статей — Блог Гардари</title><style>*{box-sizing:border-box}body{margin:0;color:#202124;font:13px Arial,sans-serif}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #202124}button{padding:9px 12px;border:1px solid #97999c;border-radius:6px;background:white;cursor:pointer;color:inherit}button[aria-pressed=true]{background:#d8c62a;border-color:#202124}a{color:inherit}iframe{display:block;width:100%;height:calc(100dvh - 100px);border:0}.note{padding:8px 18px;background:#f4f4f4;color:#565c62;font-size:12px}</style></head><body><header><strong>ФОРМА СТАТЬИ</strong><button data-key="paintings">Смотреть картины</button><button data-key="levels">Пять уровней «Я»</button><button data-key="brera">Брера</button><button data-key="hundertwasser">Хундертвассер</button><button data-key="modern-art">Современное искусство</button><button data-key="advice">7 советов</button><a id="direct" target="_blank">Открыть отдельно</a></header><div class="note"></div><iframe title="Обновлённая форма страницы статьи"></iframe><script>const entries={paintings:{url:'kak-smotret-kartiny.html',note:'Короткий практический текст и ссылка на предшествующий материал.'},levels:{url:'pyat-urovney-ya.html',note:'Длинное эссе: пять разделов, оглавление и поясняющие блоки.'},brera:{url:'galereya-brera.html',note:'Музейная фотозаметка: восемь фотографий в крупной ленте.'},hundertwasser:{url:'hundertwasser.html',note:'Очерк о художнике: десять фотографий разных пропорций.'},'modern-art':{url:'ponimanie-sovremennogo-iskusstva.html',note:'Длинный разбор: иллюстрации с подписями, пояснения и выделенные фрагменты.'},advice:{url:'7-sovetov-hudozhniku.html',note:'Практические советы, поясняющий список и отдельная цитата.'}};let p=new URLSearchParams(location.search),key=Object.hasOwn(entries,p.get('article'))?p.get('article'):'levels';function fit(){const f=document.querySelector('iframe');f.style.height=Math.max(360,innerHeight-f.getBoundingClientRect().top)+'px'}function show(){let item=entries[key];document.querySelector('iframe').src=item.url+'?editor_view=1';document.querySelector('#direct').href=item.url;document.querySelector('.note').textContent=item.note;document.querySelectorAll('[data-key]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.key===key));history.replaceState(null,'','?article='+key);fit()}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{key=b.dataset.key;show()});addEventListener('resize',fit);show();</script></body></html>
